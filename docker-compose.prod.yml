services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HA_HOST:-100.79.244.99}:5000/${POSTGRES_DB}
      - DATABASE_READ_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HA_HOST:-100.79.244.99}:5001/${POSTGRES_DB}
      - RESOURCE_SHARD_DATABASE_URLS=${RESOURCE_SHARD_DATABASE_URLS:-}
      - RESOURCE_SHARD_READ_DATABASE_URLS=${RESOURCE_SHARD_READ_DATABASE_URLS:-}
      - RESOURCE_SHARD_ID_STRIDE=${RESOURCE_SHARD_ID_STRIDE:-1000000000}
      - REDIS_URL=${REDIS_URL}
      - TRUST_PROXY_HEADERS=true
      - SECRET_KEY=${SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_QUARANTINE_BUCKET_NAME=${S3_QUARANTINE_BUCKET_NAME:-fiq-cuarentena}
      - CLAMAV_ENABLED=true
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    restart: always
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    volumes:
      - clamav_data:/var/lib/clamav

  # Cloudflare Tunnel (TryCloudflare)
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --url http://frontend:80

volumes:
  redis_data:
  minio_data:
  clamav_data:

networks:
  default:
    external: true
    name: fiq-network
