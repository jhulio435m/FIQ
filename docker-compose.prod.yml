# Despliegue de un solo VPS (fallback de Kubernetes). PostgreSQL HA corre aparte
# (ha-database/, HAProxy en el host :5000). Uso: ./deploy_main.sh
#
# Variables obligatorias en .env.prod (deploy_main.sh las genera / valida):
#   DATABASE_URL, SECRET_KEY, S3_*, CORS_ORIGINS, TUNNEL_TOKEN, BOOTSTRAP_ADMIN_*
# Almacenamiento: RustFS local con `--profile storage` (por defecto en deploy_main.sh)
# o cualquier S3 externo definiendo S3_ENDPOINT.

x-backend-env: &backend-env
  ENVIRONMENT: production
  LOG_JSON: "true"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requerido}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY requerido}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY requerido}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-fiq-recursos}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS requerido, p. ej. ["https://fiq.uncp.edu.pe"]}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  migrate:
    <<: *hardening
    image: ${BACKEND_IMAGE:-fiq-backend:local}
    build:
      context: ./backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.core.bootstrap"]
    environment:
      <<: *backend-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      # Solo si se levantó con --profile storage (RustFS local).
      rustfs:
        condition: service_healthy
        required: false

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:-fiq-backend:local}
    build:
      context: ./backend
    read_only: true
    tmpfs:
      - /tmp
    environment: *backend-env
    # HAProxy de ha-database usa network_mode: host → se alcanza por el gateway del host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:-fiq-frontend:local}
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Almacenamiento S3-compatible local (RustFS). Omítelo con un S3 externo
  # definiendo S3_ENDPOINT y levantando sin `--profile storage`.
  rustfs:
    <<: *hardening
    profiles: ["storage"]
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # Consola deshabilitada en producción: administrar por S3 API / CLI.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Túnel con nombre (no TryCloudflare): URL estable y dominio propio.
  # En Cloudflare Zero Trust: Public Hostname → http://frontend:8080
  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:2025.11.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN requerido (Cloudflare Zero Trust → Tunnels)}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  rustfs_data:
