apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fiq
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fiq
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha
  namespace: fiq
spec:
  selector:
    app.kubernetes.io/name: postgres-haproxy
  ports:
    - name: write
      port: 5000
      targetPort: write
    - name: read
      port: 5001
      targetPort: read
    - name: stats
      port: 7000
      targetPort: stats
