apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: fiq
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fiq-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fiq-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fiq-platform
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fiq-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fiq-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fiq-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: fiq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fiq
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fiq-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: fiq-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics

      - job_name: kubernetes-nodes
        scheme: https
        metrics_path: /metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      - job_name: kubernetes-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: patroni
        metrics_path: /metrics
        static_configs:
          - targets:
              - 100.97.171.89:8008
              - 100.87.33.2:8008
              - 100.110.204.72:8008
              - 100.94.200.89:8008
              - 100.79.244.99:8008
  alerts.yml: |
    groups:
      - name: fiq-platform
        rules:
          - alert: FiqBackendDown
            expr: up{job="fiq-backend"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Backend FIQ no disponible
          - alert: FiqBackendHighErrorRate
            expr: sum(rate(fiq_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(fiq_http_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Mas de 5 por ciento de respuestas del backend son errores
          - alert: FiqBackendHighLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(fiq_http_request_duration_seconds_bucket[5m]))) > 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Latencia p95 del backend superior a 2 segundos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fiq
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fiq-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: fiq-platform
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        fiq.uncp.edu.pe/app: "true"
      containers:
        - name: prometheus
          image: prom/prometheus:v3.7.3
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fiq
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: fiq-platform
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: fiq
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: fiq-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fiq-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: fiq-platform
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fiq-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: fiq-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fiq-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: fiq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: fiq
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: fiq-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: fiq-platform
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        fiq.uncp.edu.pe/app: "true"
