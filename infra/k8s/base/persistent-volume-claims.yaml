apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: fiq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fiq-backups
  namespace: fiq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 600Gi
