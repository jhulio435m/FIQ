apiVersion: v1
kind: Secret
metadata:
  name: fiq-secrets
  namespace: fiq
type: Opaque
stringData:
  DATABASE_URL: postgresql://fiq_app:replace-password@postgres-ha:5000/fiq_prod
  DATABASE_READ_URL: postgresql://fiq_app:replace-password@postgres-ha:5001/fiq_prod
  RESOURCE_SHARD_DATABASE_URLS: postgresql://fiq_shard:replace-password@resource-shard-0.resource-shard:5432/fiq_resource_shard,postgresql://fiq_shard:replace-password@resource-shard-1.resource-shard:5432/fiq_resource_shard
  RESOURCE_SHARD_READ_DATABASE_URLS: postgresql://fiq_shard:replace-password@resource-shard-0.resource-shard:5432/fiq_resource_shard,postgresql://fiq_shard:replace-password@resource-shard-1.resource-shard:5432/fiq_resource_shard
  POSTGRES_SUPERUSER_PASSWORD: replace-with-postgres-superuser-password
  POSTGRES_REPLICATION_PASSWORD: replace-with-postgres-replication-password
  POSTGRES_REWIND_PASSWORD: replace-with-postgres-rewind-password
  RESOURCE_SHARD_USER: fiq_shard
  RESOURCE_SHARD_PASSWORD: replace-with-resource-shard-password
  RESOURCE_SHARD_DB: fiq_resource_shard
  MONGO_URL: ""
  SECRET_KEY: REDACTED_FOR_BACKUP
  DASHBOARD_API_KEY: replace-with-dashboard-api-key
  S3_ACCESS_KEY: replace-with-s3-access-key
  S3_SECRET_KEY: REDACTED_FOR_BACKUP
  MINIO_ROOT_USER: replace-with-s3-access-key
  MINIO_ROOT_PASSWORD: REDACTED_FOR_BACKUP
  SMTP_HOST: smtp.office365.com
  SMTP_USERNAME: replace-with-institutional-mailbox
  SMTP_PASSWORD: replace-with-smtp-password
  SMTP_FROM: replace-with-institutional-mailbox
