apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: fiq
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/part-of: fiq-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        app.kubernetes.io/part-of: fiq-platform
    spec:
      nodeSelector:
        fiq.uncp.edu.pe/app: "true"
      containers:
        - name: clamav
          image: clamav/clamav:1.4
          ports:
            - name: clamd
              containerPort: 3310
          readinessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: fiq
spec:
  selector:
    app.kubernetes.io/name: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
