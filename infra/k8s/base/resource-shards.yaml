apiVersion: v1
kind: Service
metadata:
  name: resource-shard
  namespace: fiq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: resource-shard
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resource-shard
  namespace: fiq
  labels:
    app.kubernetes.io/name: resource-shard
    app.kubernetes.io/part-of: fiq-platform
spec:
  serviceName: resource-shard
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: resource-shard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resource-shard
        app.kubernetes.io/part-of: fiq-platform
    spec:
      nodeSelector:
        fiq.uncp.edu.pe/app: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: resource-shard
              topologyKey: kubernetes.io/hostname
      containers:
        - name: postgres
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fiq-secrets
                  key: RESOURCE_SHARD_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiq-secrets
                  key: RESOURCE_SHARD_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fiq-secrets
                  key: RESOURCE_SHARD_DB
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
