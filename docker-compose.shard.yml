services:
  resource-shard-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${RESOURCE_SHARD_USER:-fiq_shard}
      POSTGRES_PASSWORD: ${RESOURCE_SHARD_PASSWORD}
      POSTGRES_DB: ${RESOURCE_SHARD_DB:-fiq_resource_shard}
    ports:
      - "${RESOURCE_SHARD_BIND_IP:-127.0.0.1}:${RESOURCE_SHARD_PORT:-55432}:5432"
    volumes:
      - resource_shard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_SHARD_USER:-fiq_shard} -d ${RESOURCE_SHARD_DB:-fiq_resource_shard}"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  resource_shard_postgres_data:
