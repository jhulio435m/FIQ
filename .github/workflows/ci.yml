name: CI/CD Pipeline

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SESSION_COOKIE_SECURE: "false"
    
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Compose Services
        run: |
          # Start Postgres, Redis, and MinIO in the background
          docker compose up -d postgres redis minio mongo clamav
          
          # Wait for Postgres to be healthy
          echo "Waiting for Postgres..."
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U fiq -d fiq_db && break
            sleep 2
          done

          # Wait for Minio to be healthy
          echo "Waiting for Minio..."
          for i in {1..30}; do
            curl -s http://localhost:9000/minio/health/ready && break
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
          enable-cache: false

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://fiq:fiq123@localhost:5433/fiq_db
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET_NAME: fiq-recursos
          SECRET_KEY: dev-secret-key-change-in-production
        run: |
          cd backend
          uv run --frozen --extra dev pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=50

      - name: Check OpenAPI documentation alignment
        run: |
          cd backend
          uv run python scripts/check_openapi_docs.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Docker Compose stack
        run: docker compose build

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Migrate and start integrated application
        run: |
          docker compose run --rm --no-deps backend alembic upgrade head
          docker compose run --rm --no-deps backend python -m app.core.seed
          docker compose up -d --wait --wait-timeout 300 backend frontend
          curl --fail http://localhost/api/health

      - name: Run E2E Playwright tests
        env:
          DATABASE_URL: postgresql://fiq:fiq123@localhost:5433/fiq_db
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET_NAME: fiq-recursos
          SECRET_KEY: dev-secret-key-change-in-production
        run: |
          cd frontend
          # Playwright will automatically start 'npm run dev' via its config
          npx playwright test

      - name: Stop Docker Compose Services
        if: always()
        run: |
          docker compose down

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/coverage/
            backend/coverage.xml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.19'
          enable-cache: false
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit locked backend dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/fiq-runtime-requirements.txt
          uvx pip-audit --disable-pip --no-deps -r /tmp/fiq-runtime-requirements.txt

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
