name: Deploy Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  images:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: backend
          push: true
          tags: ghcr.io/jhulio435m/fiq-backend:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Scan backend release image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ghcr.io/jhulio435m/fiq-backend@${{ steps.backend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: frontend
          push: true
          tags: ghcr.io/jhulio435m/fiq-frontend:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Scan frontend release image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ghcr.io/jhulio435m/fiq-frontend@${{ steps.frontend.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    needs: [validate, images]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailnet
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.K8S_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.K8S_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.K8S_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.K8S_KNOWN_HOSTS }}
        run: ./deploy_scripts/github_actions_ssh_setup.sh

      - name: Upload application release script
        run: |
          scp deploy_scripts/release_kubernetes.sh fiq-deploy-target:/tmp/fiq_release_kubernetes.sh

      - name: Migrate, roll out and verify immutable images
        env:
          RELEASE_ENV: ${{ inputs.environment }}
          BACKEND_DIGEST: ${{ needs.images.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.images.outputs.frontend }}
          PUBLIC_URL: ${{ vars.FIQ_PUBLIC_URL }}
        run: |
          [[ "$RELEASE_ENV" =~ ^(staging|production)$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$PUBLIC_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          ssh fiq-deploy-target "bash /tmp/fiq_release_kubernetes.sh '$RELEASE_ENV' 'ghcr.io/jhulio435m/fiq-backend@$BACKEND_DIGEST' 'ghcr.io/jhulio435m/fiq-frontend@$FRONTEND_DIGEST' '$PUBLIC_URL'"
